name: CI - Hola Mundo

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar cowsay
        run: npm install -g cowsay

      - name: Ejecutar Hola Mundo
        run: node hola.js

      - name: Generar mensaje con cowsay
        run: |
          cowsay "¡Hola Mundo desde GitHub Actions!" > mensaje.txt
          cat mensaje.txt

      - name: Enviar mensaje a ntfy
        run: |
          curl \
            -H "Title: GitHub Actions 🐄" \
            -H "Priority: default" \
            -H "Tags: github,cow" \
            -d "$(cat mensaje.txt)" \
            https://ntfy.sh/devops-itla
